[pytest]
pythonpath = .
# The suite is `src/tests`.  Without this, a bare `pytest` from the repo root walks the whole
# tree and dies during COLLECTION on retired ladders under `scripts/archive/` that import
# modules deleted long ago (`s2_kine_flow_test.py` -> `scripts.s1b_gate_variants`), plus any
# scratch `test_*.py` left at the root.  That turned the most obvious command in the repo
# into an error instead of a test run.
testpaths = src/tests
norecursedirs = scripts/archive docs/archive outputs data comsol_models scratch .git
markers =
    kinematics: Test is part of the kinematics suite.
    biochem: Test is part of the biochem suite.
    slow: Heavy end-to-end test. Ten tests are ~80% of the suite's runtime -- the two COMSOL
        anchor physics checks alone are 335s + 231s of a 978s run. Iterate with
        `pytest src/tests -m "not slow"` (~2 min) and run the full suite before committing.
